<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#f6f4ee"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#16181a">Query Routing — Genie + RAG Hybrid</text>
  <text x="40" y="66" font-size="13" fill="#55564f">Procurement question &#8594; orchestration layer &#8594; Genie-only / RAG-only / hybrid</text>

  <!-- query -->
  <rect x="320" y="100" width="160" height="44" rx="4" fill="#ffffff" stroke="#c3bfae"/>
  <text x="400" y="127" text-anchor="middle" font-size="12" fill="#16181a">Procurement question</text>

  <path d="M400 144 V180" stroke="#a9a89b" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- orchestration -->
  <rect x="270" y="180" width="260" height="50" fill="#fbf1e6" stroke="#cc5500" stroke-width="1.5"/>
  <text x="400" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#cc5500">Orchestration layer</text>

  <path d="M330 230 L180 280" stroke="#a9a89b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M400 230 V280" stroke="#a9a89b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M470 230 L620 280" stroke="#a9a89b" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Genie -->
  <rect x="80" y="280" width="220" height="110" fill="#ffffff" stroke="#85847a" stroke-width="1.5"/>
  <text x="190" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#16181a">Databricks Genie</text>
  <text x="190" y="325" text-anchor="middle" font-size="10.5" fill="#55564f">Unity Catalog: EKKO, EKPO,</text>
  <text x="190" y="340" text-anchor="middle" font-size="10.5" fill="#55564f">LFA1, MARA</text>
  <text x="190" y="360" text-anchor="middle" font-size="10.5" fill="#55564f">Spend &amp; transaction</text>
  <text x="190" y="375" text-anchor="middle" font-size="10.5" fill="#55564f">questions</text>

  <!-- hybrid -->
  <rect x="300" y="280" width="200" height="110" fill="#fdf6ea" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="400" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#e07a1f">Hybrid</text>
  <text x="400" y="328" text-anchor="middle" font-size="10.5" fill="#55564f">Live number (Genie)</text>
  <text x="400" y="344" text-anchor="middle" font-size="10.5" fill="#55564f">evaluated against</text>
  <text x="400" y="360" text-anchor="middle" font-size="10.5" fill="#55564f">policy rule (RAG) —</text>
  <text x="400" y="376" text-anchor="middle" font-size="10.5" fill="#55564f">compliance questions</text>

  <!-- RAG -->
  <rect x="520" y="280" width="220" height="110" fill="#ffffff" stroke="#85847a" stroke-width="1.5"/>
  <text x="630" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#16181a">RAG</text>
  <text x="630" y="325" text-anchor="middle" font-size="10.5" fill="#55564f">6-document knowledge base:</text>
  <text x="630" y="340" text-anchor="middle" font-size="10.5" fill="#55564f">policy, SOP, glossary,</text>
  <text x="630" y="355" text-anchor="middle" font-size="10.5" fill="#55564f">vendor mgmt, analytics, FAQ</text>
  <text x="630" y="375" text-anchor="middle" font-size="10.5" fill="#55564f">Policy &amp; process questions</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a9a89b"/>
    </marker>
  </defs>
</svg>
